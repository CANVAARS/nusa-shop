<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title">Marketplace Keluarga — Nusacoin Theme</title>
    
    <!-- FONTS DARIPADA NUSACOIN SYSTEM -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ============================================================
           NUSACOIN — DESIGN TOKENS INTEGRATION
           ============================================================ */
        :root {
            --nux-green: #27ae60;
            --nux-green-dark: #1e8449;
            --nux-green-deep: #0f3d26;
            --gold: #d4a017;

            --bg: #f7f5ef;
            --surface: #ffffff;
            --surface-2: #f0efe6;
            --ink: #16231c;
            --ink-soft: #56645c;
            --border: #e3ded0;
            --shadow: 0 10px 30px -12px rgba(15,61,38,0.18);

            --font-display: 'Sora', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --radius: 14px;
            --transition: 0.35s cubic-bezier(.22,.9,.32,1.24);
        }

        html[data-theme="dark"] {
            --bg: #0d1712;
            --surface: #142219;
            --surface-2: #182a1e;
            --ink: #eef3ec;
            --ink-soft: #9db3a4;
            --border: #24382c;
            --shadow: 0 10px 34px -10px rgba(0,0,0,0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.65;
            transition: background var(--transition), color var(--transition);
        }
        h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.01em; }
        .mono { font-family: var(--font-mono); }

        /* HEADER & TOP BAR */
        header { 
            background: var(--surface); 
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100; 
            transition: background var(--transition), border-color var(--transition);
        }
        .header-wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--ink);
        }
        .logo-mark {
            width: 36px; height: 36px; border-radius: 9px;
            background: linear-gradient(135deg, var(--nux-green), var(--nux-green-deep));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1rem;
        }
        .logo-area .accent { color: var(--nux-green); }

        /* BUTTONS & TOOLS */
        .nav-tools { display: flex; align-items: center; gap: 8px; }
        .tool-btn {
            display: flex; align-items: center; gap: 6px;
            background: var(--surface-2); border: 1px solid var(--border); color: var(--ink);
            padding: 8px 14px; border-radius: 9px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
            font-family: var(--font-mono); transition: border-color 0.2s, color 0.2s, transform 0.2s;
        }
        .tool-btn:hover { border-color: var(--nux-green); color: var(--nux-green); transform: translateY(-1px); }

        /* SEARCH CONTAINER */
        .search-container { max-width: 600px; margin: 0 auto; width: 100%; }
        .search-container input {
            width: 100%;
            padding: 12px 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-container input:focus { border-color: var(--nux-green); }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(90deg, var(--nux-green-deep), var(--nux-green));
            color: #fff;
            padding: 40px 24px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 14px 34px -14px rgba(15,61,38,0.55);
        }
        .hero p { max-width: 650px; margin: 0 auto; font-size: 1.05rem; opacity: 0.95; }

        /* GRID & CARDS */
        .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            display: flex; flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--nux-green);
            box-shadow: 0 14px 26px -12px rgba(39,174,96,0.28);
        }

        .img-container { width: 100%; height: 200px; background: var(--surface-2); overflow: hidden; position: relative; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .product-card:hover .product-img { transform: scale(1.06); }

        .product-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title {
            font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; color: var(--ink);
            line-height: 1.4; height: 44px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .product-price { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 700; color: var(--nux-green); margin-bottom: 10px; }
        .product-desc { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 16px; height: 58px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

        .seller-badge {
            font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
            color: var(--nux-green); background: var(--surface-2); border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 16px;
        }

        .btn-buy {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--nux-green); color: #fff; text-decoration: none; padding: 12px;
            border-radius: 9px; font-weight: 700; font-size: 0.88rem; transition: background 0.2s, transform 0.2s;
            box-shadow: 0 8px 20px -6px rgba(39,174,96,0.55);
        }
        .btn-buy:hover { background: var(--nux-green-dark); transform: translateY(-2px); }

        .status-msg { text-align: center; font-size: 1.1rem; padding: 40px; color: var(--ink-soft); grid-column: 1 / -1; }

        /* FOOTER */
        footer {
            background: var(--surface-2); border-top: 1px solid var(--border);
            padding: 40px 0; margin-top: 60px; text-align: center; color: var(--ink-soft); font-size: 0.87rem;
            transition: background var(--transition);
        }
        footer a { color: var(--nux-green); text-decoration: none; font-weight: 600; margin-left: 10px; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- HEADER & PENCARIAN -->
    <header>
        <div class="header-wrap">
            <div class="header-top">
                <div class="logo-area">
                    <div class="logo-mark"><i class="fas fa-store"></i></div>
                    TOKO <span class="accent">BERSAMA</span>
                </div>
                <div class="nav-tools">
                    <button class="tool-btn" id="lang-toggle" aria-label="Ganti Bahasa">ID / EN</button>
                    <button class="tool-btn" id="theme-toggle" aria-label="Ganti Tema"><i class="fas fa-moon"></i></button>
                </div>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Cari barang kebutuhanmu di sini..." data-i18n-placeholder="search.placeholder" oninput="filterProduk()">
            </div>
        </div>
    </header>

    <div class="hero">
        <div class="wrap">
            <p data-i18n="hero.desc">Selamat datang di Marketplace lokal kami. Cari produk terbaik yang langsung diunggah oleh para pedagang terpercaya kami.</p>
        </div>
    </div>

    <!-- UTAMA PRODUK -->
    <main class="wrap">
        <div class="product-grid" id="productGrid">
            <div class="status-msg" id="statusMessage" data-i18n="status.loading">Sedang memuat produk terpilih...</div>
        </div>
    </main>

    <script>
        /* ---------------- DICTIONARY (ID / EN) ---------------- */
        const dict = {
            id: {
                "app.title": "Marketplace Keluarga — Nusacoin Theme",
                "search.placeholder": "Cari barang kebutuhanmu di sini...",
                "hero.desc": "Selamat datang di Marketplace lokal kami. Cari produk terbaik yang langsung diunggah oleh para pedagang terpercaya kami.",
                "status.loading": "Sedang memuat produk terpilih...",
                "status.error": "Gagal memuat produk. Periksa koneksi atau URL CSV.",
                "status.empty": "Produk tidak ditemukan atau belum ada dagangan.",
                "card.seller": "SELLER:",
                "card.buy": "Hubungi Penjual",
                "footer.copy": "© 2026 Toko Bersama. Powered by Nusacoin Design.",
                "footer.portal": "Masuk ke Portal Penjual",
                "wa.text": "Halo, saya tertarik dengan produk \"{nama}\" seharga {harga}. Apakah masih tersedia?"
            },
            en: {
                "app.title": "Family Marketplace — Nusacoin Theme",
                "search.placeholder": "Search for items you need here...",
                "hero.desc": "Welcome to our local Marketplace. Find the best products uploaded directly by our trusted sellers.",
                "status.loading": "Loading selected products...",
                "status.error": "Failed to load products. Check your connection or CSV URL.",
                "status.empty": "No products found or available.",
                "card.seller": "SELLER:",
                "card.buy": "Contact Seller",
                "footer.copy": "© 2026 Toko Bersama. Powered by Nusacoin Design.",
                "footer.portal": "Enter Seller Portal",
                "wa.text": "Hello, I am interested in the product \"{nama}\" priced at {harga}. Is it still available?"
            }
        };

        let currentLang = 'id';
        let currentTheme = 'light';
        let listSemuaProduk = [];

        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEKRc1VKMVTMAVKccUr4RhSBTBNFofUrYANxx_5Dy5v9yNc4B7IZfujS3mMifXXBIOT7Ymvjz9Sg6P/pub?gid=2040498345&single=true&output=csv"; 

        /* ---------------- TEMA (DARK / LIGHT) ---------------- */
        const root = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');

        function applyTheme(t) {
            currentTheme = t;
            root.setAttribute('data-theme', t);
            themeBtn.innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }

        themeBtn.addEventListener('click', () => {
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        /* ---------------- BAHASA (ID / EN) ---------------- */
        const langBtn = document.getElementById('lang-toggle');

        function applyLang(l) {
            currentLang = l;
            document.documentElement.lang = l;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[l][key]) el.textContent = dict[l][key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dict[l][key]) el.placeholder = dict[l][key];
            });

            langBtn.textContent = l === 'id' ? 'ID / EN' : 'EN / ID';

            if (listSemuaProduk.length > 0) {
                tampilkanProduk(listSemuaProduk);
            }
        }

        langBtn.addEventListener('click', () => {
            applyLang(currentLang === 'id' ? 'en' : 'id');
        });

        /* ---------------- FETCH CSV ---------------- */
        function muatDataProduk() {
            fetch(CSV_URL)
            .then(response => response.text())
            .then(data => {
                const baris = data.split("\n");
                listSemuaProduk = [];

                for (let i = 1; i < baris.length; i++) {
                    if (!baris[i].trim()) continue;
                    const kolom = parseCSVRow(baris[i]);
                    if (kolom.length >= 6) {
                        listSemuaProduk.push({
                            id: kolom[0],
                            nama: kolom[1],
                            harga: kolom[2],
                            keterangan: kolom[3],
                            kontak: kolom[4],
                            gambar: kolom[5],
                            penjual: kolom[6] || "Umum"
                        });
                    }
                }
                
                listSemuaProduk.reverse();
                tampilkanProduk(listSemuaProduk);
            })
            .catch(err => {
                const msgEl = document.getElementById("statusMessage");
                if(msgEl) msgEl.innerText = dict[currentLang]["status.error"];
                console.error(err);
            });
        }

        function parseCSVRow(text) {
            let p = [''], i = 0, r = false;
            for (let q = 0; q < text.length; q++) {
                let c = text[q];
                if (c === '"') { r = !r; }
                else if (c === ',' && !r) { p[++i] = ''; }
                else { p[i] += c; }
            }
            return p;
        }

        /* ---------------- RENDER PRODUK ---------------- */
        function tampilkanProduk(produkArray) {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";

            if (produkArray.length === 0) {
                grid.innerHTML = `<div class="status-msg">${dict[currentLang]["status.empty"]}</div>`;
                return;
            }

            produkArray.forEach(item => {
                const currencyFormat = currentLang === 'en' ? 'USD' : 'IDR';
                const localeFormat = currentLang === 'en' ? 'en-US' : 'id-ID';
                
                const hargaFormat = new Intl.NumberFormat(localeFormat, { 
                    style: 'currency', 
                    currency: currencyFormat, 
                    minimumFractionDigits: 0 
                }).format(item.harga);
                
                const textTemplate = dict[currentLang]["wa.text"]
                    .replace("{nama}", item.nama)
                    .replace("{harga}", hargaFormat);
                
                const teksWA = encodeURIComponent(textTemplate);
                const linkWA = `https://wa.me/${item.kontak.trim()}?text=${teksWA}`;

                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <div class="img-container">
                        <img class="product-img" src="${item.gambar}" alt="${item.nama}" onerror="this.src='https://placehold.co/400x300?text=No+Image'">
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="product-title" title="${item.nama}">${item.nama}</div>
                            <div class="product-price">${hargaFormat}</div>
                            <div class="product-desc">${item.keterangan}</div>
                        </div>
                        <div>
                            <span class="seller-badge">👤 ${dict[currentLang]["card.seller"]} ${item.penjual}</span>
                            <a href="${linkWA}" target="_blank" class="btn-buy"><i class="fab fa-whatsapp"></i> ${dict[currentLang]["card.buy"]}</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProduk() {
            const keyword = document.getElementById("searchInput").value.toLowerCase();
            const hasilFilter = listSemuaProduk.filter(item => {
                return item.nama.toLowerCase().includes(keyword) || item.keterangan.toLowerCase().includes(keyword);
            });
            tampilkanProduk(hasilFilter);
        }

        /* ---------------- INIT ---------------- */
        window.onload = () => {
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(isDark ? 'dark' : 'light');
            applyLang('id');
            muatDataProduk();
        };
    </script>

    <!-- FOOTER -->
    <footer>
        <div class="wrap">
            <span data-i18n="footer.copy">© 2026 Toko Bersama. Powered by Nusacoin Design.</span>
            <a href="login.html" data-i18n="footer.portal">Masuk ke Portal Penjual</a>
        </div>
    </footer>
</body>
</html>
